services:
  - type: web
    name: news-sentiment-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port 8000"
    plan: free
    region: oregon
    branch: main
    repo: https://github.com/Ansh-DSML/fastapi-news-backend
    envVars:
      - key: NEWS_API_KEY
        value: 5eab13d77b3148d99f8b19b7efd9502b
